<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D迷宫探索者</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    #game-container { width: 100vw; height: 100vh; }
    #hud { position: absolute; top: 10px; left: 10px; right: 10px; color: white; }
    #stats { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0,0,0,0.7); border-radius: 8px; }
    #minimap { position: absolute; top: 70px; left: 10px; width: 180px; height: 180px; background: rgba(0,0,0,0.8); border: 2px solid #444; border-radius: 8px; }
    #controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
    #controls button { padding: 10px 20px; font-size: 14px; cursor: pointer; border: none; border-radius: 5px; background: rgba(100,100,100,0.8); color: white; }
    #controls button:hover { background: rgba(150,150,150,0.9); }
    #theme-selector { position: absolute; top: 10px; right: 10px; }
    #theme-selector select { padding: 8px; font-size: 14px; background: rgba(0,0,0,0.7); color: white; border: 1px solid #444; border-radius: 5px; }
    #maze-size { position: absolute; top: 50px; right: 10px; display: flex; align-items: center; gap: 10px; color: white; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 5px; }
    #maze-size input { width: 80px; padding: 5px; }
    #completion-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 40px; border-radius: 15px; text-align: center; display: none; z-index: 100; }
    #completion-modal h2 { margin-bottom: 20px; }
    #completion-modal p { margin: 10px 0; }
    #completion-modal button { margin-top: 20px; padding: 10px 30px; font-size: 16px; cursor: pointer; }
    #leaderboard { position: absolute; top: 10px; right: 200px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 8px; font-size: 12px; }
    #leaderboard h3 { margin-bottom: 5px; }
    #leaderboard table { border-collapse: collapse; }
    #leaderboard td { padding: 3px 10px; border-bottom: 1px solid #444; }
  </style>
  <script type="module" crossorigin src="/assets/index-CaY55IJz.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <div id="hud">
    <div id="stats">
      <div>时间: <span id="time">00:00</span></div>
      <div>步数: <span id="steps">0</span></div>
    </div>
  </div>
  <canvas id="minimap"></canvas>
  <div id="theme-selector">
    <select id="theme">
      <option value="castle">石头城堡</option>
      <option value="space">科幻空间站</option>
      <option value="garden">花园篱笆</option>
    </select>
  </div>
  <div id="maze-size">
    <label>迷宫大小:</label>
    <input type="range" id="size-slider" min="10" max="50" value="20">
    <span id="size-value">20x20</span>
  </div>
  <div id="leaderboard">
    <h3>排行榜</h3>
    <table id="leaderboard-table"></table>
  </div>
  <div id="controls">
    <button id="regenerate">重新生成</button>
    <button id="reset">重置位置</button>
    <button id="hint">提示 (H)</button>
  </div>
  <div id="completion-modal">
    <h2>🎉 恭喜通关！</h2>
    <p>耗时: <span id="final-time">00:00</span></p>
    <p>步数: <span id="final-steps">0</span></p>
    <p>探索率: <span id="exploration-rate">0%</span></p>
    <button id="play-again">再玩一次</button>
  </div>
</body>
</html>
